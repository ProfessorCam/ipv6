<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPv6 Subnetting</title>
  <script>
    /* Theme before first paint. Dark is the default; a saved choice or ?theme=light wins. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('packet-lessons-theme'); } catch (e) {}
      var q = /[?&]theme=(light|dark)/i.exec(location.search);
      if (q) t = q[1].toLowerCase();
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <button id="menu-btn" class="rail" type="button" aria-label="Open site menu" aria-expanded="false" aria-controls="sitemenu">
      <span class="rail-chevron" aria-hidden="true">&#8250;</span>
      <span class="rail-logo" aria-hidden="true">&#9673;</span>
    </button>
    <nav id="sitemenu" class="sitemenu" aria-label="Sites"></nav>
    <aside class="side">
      <div class="brand">
        <a href="#" class="brand-link"><span class="logo" aria-hidden="true">&#9673;</span><span>Packet Lessons</span></a>
        <p class="brand-sub"><b>IPv6 Subnetting.</b> Hex, the /64 line, how many subnets a prefix holds, and which addresses are which.</p>
      </div>
      <nav id="nav" class="nav" aria-label="Lessons"></nav>
      <div class="side-foot">
        Every address on this site is computed live from what you type.<br>
        Nothing is looked up; it is all arithmetic on 128 bits.
      </div>
    </aside>
    <main id="main" class="main"><div class="level-bar-wrap" id="level-bar"></div><div id="content" aria-live="polite"></div></main>
  </div>

  <script src="ipv6.js"></script>
  <script src="checks.js"></script>
  <script src="lessons.js"></script>
  <script src="level.js"></script>
  <script src="app.js"></script>
</body>
</html>
